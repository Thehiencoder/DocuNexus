services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docunexus-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    volumes:
      - ./qdrant_data:/qdrant/storage
